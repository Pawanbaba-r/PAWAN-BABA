<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Image Prompt Generator</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#0d47a1,#ff9800);
  color:#fff;
}

.container{
  max-width:900px;
  margin:auto;
  padding:15px;
}

.header{
  background:#fff;
  color:#000;
  padding:15px;
  border-radius:12px;
  text-align:center;
  margin-bottom:15px;
}

.card{
  background:#ffffff;
  color:#000;
  border-radius:12px;
  padding:15px;
  margin-bottom:15px;
}

h1,h2{
  margin-top:0;
}

textarea{
  width:100%;
  height:140px;
  padding:10px;
  border-radius:10px;
  border:1px solid #ccc;
  font-size:14px;
}

button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  background:#0d47a1;
  color:#fff;
  font-size:16px;
  font-weight:bold;
  margin-top:10px;
}

.sample{
  background:#f5f5f5;
  padding:10px;
  border-radius:10px;
  margin-bottom:10px;
  cursor:pointer;
}

.sample:hover{
  background:#ffe0b2;
}

.output{
  background:#000;
  color:#00ff66;
  padding:12px;
  border-radius:10px;
  min-height:80px;
  white-space:pre-wrap;
}

.footer{
  text-align:center;
  padding:10px;
  font-size:13px;
}
</style>
</head>

<body>

<div class="container">

<div class="header">
  <h1>🎨 AI Image Prompt Generator</h1>
  <p>ChatGPT / AI image banane ke liye prompt generate kare</p>
</div>

<!-- USER INPUT -->
<div class="card">
  <h2>✍️ Prompt Likhe</h2>

  <textarea id="idea" placeholder="Example:
Ek realistic lion jungle me 4K cinematic style me"></textarea>

  <button onclick="generatePrompt()">Generate Prompt</button>
</div>

<!-- OUTPUT -->
<div class="card">
  <h2>🤖 Generated Prompt</h2>

  <div class="output" id="output">
Yahan generated prompt dikhega...
  </div>

  <button onclick="copyPrompt()">📋 Copy Prompt</button>
</div>

<!-- SAMPLE PROMPTS -->
<div class="card">
  <h2>🔥 Sample Prompts</h2>

  <div class="sample"
  onclick="setSample('A futuristic Indian village with flying cars, ultra realistic, cinematic lighting, 8K')">
  🚀 Futuristic Indian Village
  </div>

  <div class="sample"
  onclick="setSample('A realistic tiger wearing sunglasses sitting on a royal throne, ultra HD, dramatic lighting')">
  🐯 Royal Tiger
  </div>

  <div class="sample"
  onclick="setSample('A beautiful anime girl in rain, neon city background, cinematic anime style')">
  🌧️ Anime Girl
  </div>

  <div class="sample"
  onclick="setSample('A cyberpunk Baba Digital Hub shop glowing at night, ultra realistic, 4K')">
  🏪 Cyberpunk Shop
  </div>

  <div class="sample"
  onclick="setSample('Lord Shiva meditating in Himalayas, divine aura, ultra realistic spiritual art')">
  🕉️ Lord Shiva Art
  </div>

</div>

</div>

<div class="footer">
© 2026 AI Prompt Generator
</div>

<script>

function generatePrompt(){

  var idea = document.getElementById("idea").value;

  if(idea==""){
    alert("Pehle idea likhe");
    return;
  }

  var finalPrompt =
  "Ultra realistic, highly detailed, cinematic lighting, 4K HD, professional AI art of: "
  + idea +
  ". Trending on ArtStation, masterpiece quality.";

  document.getElementById("output").innerText = finalPrompt;
}

function copyPrompt(){

  var text = document.getElementById("output").innerText;

  navigator.clipboard.writeText(text);

  alert("Prompt copied!");
}

function setSample(text){

  document.getElementById("idea").value = text;

}

</script>

</body>
</html>
